name: caderno_campo
description: "Caderno de Campo do Vale — app de registro de atividades agrícolas."
# Não publicar em pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Ícones no estilo iOS. Vem por padrão no flutter create.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Configuração específica do Flutter.
flutter:
  # Usa o Material Design.
  uses-material-design: true
